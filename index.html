/* ═══════════ اليوم ═══════════ */
function monthProgress(){
  const b = S.boot, today = b.today, m = today.slice(0,7);
  let d = m + '-01'; if (d < b.settings.startDate) d = b.settings.startDate;
  let total = 0;
  while (d <= today && d.slice(0,7) === m) { if (!isOff(d)) total++; d = addDays(d,1); }
  const pend = b.pendingDays.filter(x => x.slice(0,7) === m).length;
  return { done: Math.max(0,total - pend), total };
}

function dayHead(){
  head({ title: dateLong(S.date), sub: 'تقرير اليوم · ' + dObj(S.date).getUTCFullYear(), ring: monthProgress(),
    extra:`<div class="daynav"><button class="icon-btn" id="d-prev" aria-label="اليوم السابق">${IC.right}</button><button class="icon-btn" id="d-next" aria-label="اليوم التالي">${IC.left}</button></div>` });
  $('#d-prev').onclick = () => moveDay(-1);
  $('#d-next').onclick = () => moveDay(1);
}

/** يبني يومًا محليًا بلا انتظار الخادم (بعد حفظ يوم سابق) */
function localAccess(date){
  const b = S.boot;
  if (date > b.today) return { ok:false, reason:'لا يمكن ملء يوم لم يأتِ بعد' };
  if (date < b.settings.startDate) return { ok:false, reason:'هذا اليوم قبل تاريخ بداية التسجيل' };
  if (isOff(date)) return { ok:false, reason:'عطلة أسبوعية' };
  if (monthClosed(date.slice(0,7))) return { ok:false, reason:'شهر ' + date.slice(0,7) + ' مغلق' };
  if (b.pendingDays.length && b.pendingDays[0] < date) return { ok:false, reason:'يجب ملء تقرير يوم ' + b.pendingDays[0] + ' أولًا', blockedBy:b.pendingDays[0] };
  return { ok:true };
}
function recentFor(wid){
  const seen = [];
  Object.keys(C.days).sort().reverse().forEach(k => { const w = (C.days[k].workers||[]).find(x => x.id === wid); if (w) { (w.pieceItems||[]).forEach(p => { if (!seen.includes(p.typeId)) seen.push(p.typeId); }); (w.recentTypes||[]).forEach(t => { if (!seen.includes(t)) seen.push(t); }); } });
  return seen.slice(0, 8);
}
function lastBalances(){
  const ks = Object.keys(C.days).sort().reverse();
  for (const k of ks) if (C.days[k].balances) return { month: C.days[k].balanceMonth, balances: clone(C.days[k].balances) };
  return { month: S.boot.openMonth, balances: {} };
}
function buildLocalDay(date){
  const acc = localAccess(date), lb = lastBalances();
  return { date, local:true, isOffDay: isOff(date), dayStatus:'جديد', savedBy:'', canEdit: acc.ok, reason: acc.ok ? '' : acc.reason, blockedBy: acc.blockedBy || '',
    balanceMonth: lb.month, balances: lb.balances,
    workers: S.boot.workers.filter(w => isActiveOn(w, date)).map(w => ({ id:w.id, name:w.name, wageType:w.wageType, pieces:w.pieces, hours:w.hours,
      status:'حاضر', absHours:0, otHours:0, pieceItems:[], recentTypes: recentFor(w.id), movements:[] })) };
}

async function renderDay(){
  if (!S.date) S.date = S.boot.nextDay;
  dayHead();
  const date = S.date;
  const cached = C.days[date];
  if (cached) { S.day = clone(cached); S.dirty = false; drawDay(); }
  else if (date === S.boot.nextDay || localAccess(date).ok) { S.day = buildLocalDay(date); S.dirty = false; drawDay(); }
  else $('#main').innerHTML = skeleton();
  if (Q.items.length) return;      // سيُحدَّث بعد انتهاء الطابور
  const r = await api('dayBundle', { date }, null, !!(cached || S.day));
  if (S.tab !== 'day' || S.date !== date || Q.items.length) return;
  if (!r.ok) { if (!S.day || S.day.date !== date) $('#main').innerHTML = `<div class="notice warn">${esc(r.error)}</div>`; return; }
  saveBoot(r.data.boot);
  C.days[date] = r.data.day; persistCache();
  if (S.dirty) return;
  S.day = clone(r.data.day);
  dayHead(); drawDay();
}

function skeleton(){ return `<div class="cards">${'<div class="wcard" style="height:170px;opacity:.55"></div>'.repeat(3)}</div>`; }

function moveDay(n){
  if (S.dirty && !confirm('لم تحفظ تقرير اليوم. هل تريد المغادرة؟')) return;
  let d = addDays(S.date, n), g = 0;
  while (isOff(d) && g++ < 7) d = addDays(d, n);
  if (d > S.boot.today) return toast('لا يمكن فتح يوم لم يأتِ بعد');
  if (d < S.boot.settings.startDate) return toast('هذا قبل تاريخ بداية التسجيل');
  S.date = d; S.dirty = false; renderDay();
}

function drawDay(){
  const D = S.day, main = $('#main'), b = S.boot;
  const pend = b.pendingDays.filter(x => x !== D.date);
  let top = '';
  if (D.isOffDay) top += `<div class="notice info">يوم ${esc(b.settings.offDay)} عطلة أسبوعية، لا يُطلب فيه تقرير.</div>`;
  if (D.blockedBy) top += `<div class="notice warn"><span>${esc(D.reason)}</span><button class="btn-small red" id="go-block">افتح ${dateShort(D.blockedBy)}</button></div>`;
  else if (!D.canEdit && D.reason && !D.isOffDay) top += `<div class="notice warn">${esc(D.reason)}</div>`;
  if (!D.blockedBy && pend.length && pend[0] < D.date) top += `<div class="notice warn"><span>أيام بلا تقرير: ${pend.length}</span><button class="btn-small red" id="go-pend">افتح ${dateShort(pend[0])}</button></div>`;
  if (D.dayStatus === 'محفوظ') top += `<div class="notice ok">التقرير محفوظ${D.savedBy?' بواسطة '+esc(D.savedBy):''}.${D.canEdit?' يمكنك تعديله ثم الحفظ من جديد.':''}</div>`;
  if (D.dayStatus === 'مغلقة') top += `<div class="notice info">سُجّل هذا اليوم: الورشة مغلقة، يومًا بلا أجر لجميع العمال.${D.canEdit?' لتغييره املأ التقرير واحفظه.':''}</div>`;
  if (D.isOffDay) { main.innerHTML = top; return; }

  const presentN = D.workers.filter(w=>w.status==='حاضر').length;
  const cards = D.workers.length ? `<div class="cards">${D.workers.map((w,i)=>workerCard(w,i,D.canEdit)).join('')}</div>`
    : `<div class="panel empty">لا يوجد عمال نشطون في هذا اليوم.<br><br><button class="btn-small" id="go-workers">أضف عاملًا</button></div>`;
  const editBar = D.canEdit ? `<div class="actions day-actions">
      <button class="btn-main" id="save-day" ${D.workers.length?'':'disabled'}>${D.dayStatus==='محفوظ'?'حفظ التعديلات':'حفظ تقرير اليوم'}</button>
      <button class="btn-ghost" id="close-day">الورشة مغلقة اليوم</button></div>` : '';
  main.innerHTML = top + `<div class="section-h"><h2>العمال</h2><span class="tag gold" id="present-tag">${presentN} حاضر من ${D.workers.length}</span></div>` + cards + editBar;

  if ($('#go-block')) $('#go-block').onclick = () => { S.date = D.blockedBy; renderDay(); };
  if ($('#go-pend')) $('#go-pend').onclick = () => { S.date = pend[0]; renderDay(); };
  if ($('#go-workers')) $('#go-workers').onclick = () => goTab('workers');
  if ($('#save-day')) $('#save-day').onclick = saveDay;
  if ($('#close-day')) $('#close-day').onclick = closeDayFlow;
  bindCards(main);
}

function workerCard(w, i, edit){
  const absent = w.status === 'غائب';
  const pcsCount = w.pieceItems.reduce((a,p)=>a+(+p.qty||0),0);
  const pcsTypes = w.pieceItems.filter(p=>p.qty>0).length;
  const hasHours = w.wageType !== 'بدون';
  const stepbox = (field, label, val) => `<div class="stepbox"><span class="lbl">${label}</span><div class="stepper">
      ${edit?`<button class="step" data-i="${i}" data-f="${field}" data-d="0.5" aria-label="زيادة ${label}">+</button>`:'<span></span>'}
      <b class="num ${val?'':'zero'}">${val}</b>
      ${edit?`<button class="step" data-i="${i}" data-f="${field}" data-d="-0.5" aria-label="إنقاص ${label}" ${val<=0?'disabled':''}>−</button>`:'<span></span>'}
    </div></div>`;
  const pcsTile = w.pieces ? `<button class="tile ${pcsCount?'has':''}" data-pcs="${i}">${IC.pieces}${pcsCount?`<span><span class="num">${pcsCount}</span> قطعة · ${pcsTypes} ${pcsTypes>2&&pcsTypes<11?'أنواع':'نوع'}</span>`:`<span>${edit?'تسجيل القطع':'لا قطع'}</span>`}</button>` : '';
  const movTile = `<button class="tile ${(w.pieces && !absent)?'':'full'}" data-mov="${i}">${IC.money}<span>دفعة · منحة · خصم</span></button>`;
  const movLine = w.movements.length ? `<div class="movline">${w.movements.map(m=>`${m.type} ${money(m.amount)} دج`).join(' · ')}</div>` : '';
  return `<div class="wcard ${absent?'absent':''}" data-i="${i}">
    <div class="wtop">
      ${avatar(w.name, w.id)}
      <div class="wname"><b>${esc(w.name)}</b><span>${wageDesc(w)}${w.hours?` · ${w.hours} سا/يوم`:''}</span></div>
      <button class="status ${absent?'off':''}" data-i="${i}" ${edit?'':'disabled'} aria-pressed="${!absent}" aria-label="${esc(w.name)}: ${absent?'غائب':'حاضر'}">${absent?IC.x:IC.check}</button>
    </div>
    <div class="wgrid">
      ${absent ? `<div class="abs-note">غائب اليوم</div>` : (hasHours ? stepbox('absHours','ساعات الغياب', w.absHours) + stepbox('otHours','ساعات إضافية', w.otHours) : '')}
      ${absent ? '' : pcsTile}${movTile}${movLine}
    </div>
  </div>`;
}

function bindCards(root){
  root.querySelectorAll('.status').forEach(b => b.onclick = () => {
    const w = S.day.workers[+b.dataset.i];
    w.status = w.status === 'غائب' ? 'حاضر' : 'غائب';
    if (w.status === 'غائب') { w.absHours = 0; w.otHours = 0; }
    S.dirty = true; redrawCard(+b.dataset.i);
  });
  root.querySelectorAll('.step[data-f]').forEach(b => b.onclick = () => {
    const w = S.day.workers[+b.dataset.i], f = b.dataset.f;
    const v = Math.max(0, (+w[f]||0) + (+b.dataset.d));
    if (f === 'absHours' && w.hours && v >= w.hours) return toast('غياب يوم كامل؟ اضغط الدائرة لتسجيله غائبًا', true);
    w[f] = v; S.dirty = true; redrawCard(+b.dataset.i);
  });
  root.querySelectorAll('[data-pcs]').forEach(b => b.onclick = () => openPieces(+b.dataset.pcs));
  root.querySelectorAll('[data-mov]').forEach(b => b.onclick = () => openMovement(S.day.workers[+b.dataset.mov]));
}
function redrawCard(i){
  const el = $(`.wcard[data-i="${i}"]`); if (!el) return;
  const tmp = document.createElement('div'); tmp.innerHTML = workerCard(S.day.workers[i], i, S.day.canEdit);
  const n = tmp.firstElementChild; el.replaceWith(n); bindCards(n);
  const tag = $('#present-tag'); if (tag) tag.textContent = `${S.day.workers.filter(w=>w.status==='حاضر').length} حاضر من ${S.day.workers.length}`;
}

function openPieces(i){
  const w = S.day.workers[i], edit = S.day.canEdit;
  const qty = {}; w.pieceItems.forEach(p => qty[p.typeId] = (qty[p.typeId]||0) + (+p.qty||0));
  const active = S.boot.types.filter(t => t.active || qty[t.id]);
  if (!active.length) { toast('لا توجد أنواع قطع. أضفها من تبويب القطع.', true); return; }
  const recent = new Set([...(w.recentTypes||[]), ...Object.keys(qty)]);
  const first = [], rest = [];
  active.forEach(t => (recent.has(t.id) ? first : rest).push(t));
  if (!first.length) first.push(...rest.splice(0, Math.min(4, rest.length)));
  const row = t => `<div class="prow"><div class="grow"><b>${esc(t.name)}</b><small>${dz(t.price)} للقطعة</small></div>
    <div class="qty">${edit?`<button class="step" data-t="${t.id}" data-d="1" aria-label="زيادة">+</button>`:''}
    <input class="num" inputmode="numeric" data-q="${t.id}" value="${qty[t.id]||0}" ${edit?'':'readonly'} aria-label="عدد ${esc(t.name)}">
    ${edit?`<button class="step" data-t="${t.id}" data-d="-1" aria-label="إنقاص">−</button>`:''}</div></div>`;
  openSheet(`<h3>قطع ${esc(w.name)}</h3><div class="sub">${dateLong(S.date)}</div>
    <div>${first.map(row).join('')}</div>
    ${rest.length?`<button class="more-btn" id="p-more">أنواع أخرى (${rest.length})</button><div id="p-rest" class="hidden">${rest.map(row).join('')}</div>`:''}
    <div class="kv total"><span>المجموع</span><b id="p-total"></b></div>
    <div class="actions">${edit?'<button class="btn-main" id="p-ok">تم</button>':''}<button class="btn-ghost" id="p-cancel">${edit?'إلغاء':'إغلاق'}</button></div>`, sh => {
      const total = () => { let s=0,c=0; sh.querySelectorAll('[data-q]').forEach(inp => { const t = typeById(inp.dataset.q); const q = Math.max(0, parseInt(inp.value)||0); c+=q; s += q*(t?t.price:0); }); $('#p-total',sh).innerHTML = `<span class="num">${c}</span> قطعة · ${dz(s)}`; };
      sh.querySelectorAll('.step').forEach(b => b.onclick = () => { const inp = $(`[data-q="${b.dataset.t}"]`, sh); inp.value = Math.max(0,(parseInt(inp.value)||0) + (+b.dataset.d)); total(); });
      sh.querySelectorAll('[data-q]').forEach(inp => { inp.oninput = total; inp.onfocus = () => inp.select(); });
      if ($('#p-more',sh)) $('#p-more',sh).onclick = () => { $('#p-rest',sh).classList.remove('hidden'); $('#p-more',sh).remove(); };
      $('#p-cancel',sh).onclick = closeSheet;
      if ($('#p-ok',sh)) $('#p-ok',sh).onclick = () => {
        const items = [];
        sh.querySelectorAll('[data-q]').forEach(inp => { const q = Math.max(0, parseInt(inp.value)||0); if (q) items.push({ typeId: inp.dataset.q, qty:q }); });
        w.pieceItems = items; S.dirty = true; closeSheet(); redrawCard(i);
      };
      total();
    });
}

/** بعد الحفظ المحلي: نحدّث الأيام الناقصة وننتقل فورًا */
function localDayDone(date, status, stay){
  const b = S.boot;
  b.pendingDays = b.pendingDays.filter(x => x !== date);
  b.nextDay = b.pendingDays.length ? b.pendingDays[0] : b.today;
  saveBoot(b);
  markStale();
  const next = stay ? date : (b.pendingDays.length ? b.pendingDays[0] : date);
  S.dirty = false;
  S.date = next;
  S.day = C.days[next] ? clone(C.days[next]) : buildLocalDay(next);
  dayHead(); drawDay();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function saveDay(){
  const D = S.day;
  for (const w of D.workers) if (w.status === 'حاضر' && w.hours && w.absHours >= w.hours) return toast(w.name + ': ساعات الغياب يوم كامل، سجّله غائبًا', true);
  const rows = D.workers.map(w => ({ workerId:w.id, status:w.status, absHours:w.absHours, otHours:w.otHours, pieceItems:w.pieceItems }));
  const stay = D.dayStatus === 'محفوظ';
  const saved = clone(D); saved.dayStatus = 'محفوظ'; saved.savedBy = S.user.name; saved.local = true;
  C.days[D.date] = saved; persistCache();
  enqueue('saveDay', { date:D.date, rows, stay }, 'تقرير ' + dateShort(D.date));
  toast('حُفظ تقرير ' + dateShort(D.date));
  localDayDone(D.date, 'محفوظ', stay);
}

async function closeDayFlow(){
  const hasData = S.day.dayStatus === 'محفوظ';
  const ok = await confirmBox('الورشة مغلقة اليوم؟', `يُسجَّل ${dateLong(S.date)} يوم إغلاق: <b>بلا أجر لجميع العمال</b>، ويُخصم يوم من أصحاب الأجر الشهري.${hasData?'<br>سيُحذف تقرير هذا اليوم المحفوظ.':''}`, 'نعم، الورشة مغلقة', true);
  if (!ok) return;
  const date = S.date;
  const d = clone(S.day); d.dayStatus = 'مغلقة'; d.workers = d.workers.map(w => Object.assign(w, { status:'حاضر', absHours:0, otHours:0, pieceItems:[] }));
  C.days[date] = d; persistCache();
  enqueue('closeWorkshopDay', { date }, 'إغلاق الورشة ' + dateShort(date));
  toast('سُجّل يوم الإغلاق');
  localDayDone(date, 'مغلقة', false);
}

/* ═══════════ الحركات المالية ═══════════ */
function pendingAdvances(wid, month){
  return Q.items.filter(o => o.action === 'addMovement' && o.data.workerId === wid && o.data.month === month)
    .reduce((a,o) => a + (o.data.type === 'منحة' ? -o.data.amount : o.data.amount), 0);
}
function knownBalance(wid, month){
  const src = (S.day && S.day.balanceMonth === month && S.day.balances) ? S.day.balances : (lastBalances().month === month ? lastBalances().balances : null);
  if (!src || typeof src[wid] !== 'number') return null;
  return src[wid] - pendingAdvances(wid, month);
}
function openMovement(w){
  const b = S.boot;
  const openMonths = b.months.filter(m => m.status === 'مفتوح').map(m => m.month).sort();
  if (!openMonths.includes(b.openMonth)) openMonths.unshift(b.openMonth);
  let type = 'دفعة', force = false;
  const sh = openSheet(`<h3>${esc(w.name)}</h3><div class="sub">حركة مالية</div>
    <div class="field"><div class="seg" id="mv-type">${['دفعة','منحة','خصم'].map(t=>`<button data-t="${t}">${t}</button>`).join('')}</div></div>
    <div class="notice info" id="mv-bal"></div>
    <div class="two"><div class="field"><label for="mv-amount">المبلغ (دج)</label><input id="mv-amount" class="num" inputmode="decimal"></div>
    <div class="field"><label for="mv-month">يُحسب لشهر</label><select id="mv-month">${openMonths.map(m=>`<option value="${m}" ${m===b.openMonth?'selected':''}>${monthName(m)}</option>`).join('')}</select></div></div>
    <div class="field"><label for="mv-note" id="mv-note-l">ملاحظة</label><input id="mv-note"></div>
    <div id="mv-warn"></div>
    <div class="actions"><button class="btn-main" id="mv-ok">تسجيل</button><button class="btn-ghost" id="mv-cancel">إلغاء</button></div>`);
  const resetForce = () => { force = false; $('#mv-warn',sh).innerHTML = ''; $('#mv-ok',sh).className = 'btn-main'; $('#mv-ok',sh).textContent = 'تسجيل ' + type; };
  const setType = t => { type = t; sh.querySelectorAll('#mv-type button').forEach(x=>x.classList.toggle('on', x.dataset.t===t)); $('#mv-note-l',sh).textContent = t==='دفعة' ? 'ملاحظة (اختيارية)' : 'ملاحظة تشرح ' + (t==='منحة'?'المنحة':'الخصم') + ' (مطلوبة)'; resetForce(); };
  sh.querySelectorAll('#mv-type button').forEach(x => x.onclick = () => setType(x.dataset.t));
  setType(type);
  $('#mv-amount',sh).oninput = resetForce;
  let bal = null;
  const showBal = async () => {
    const m = $('#mv-month',sh).value;
    bal = knownBalance(w.id, m);
    if (bal !== null) { $('#mv-bal',sh).innerHTML = `رصيده في ${monthName(m)} حتى الآن: <b>${dz(bal)}</b>`; return; }
    $('#mv-bal',sh).textContent = 'جارٍ حساب الرصيد…';
    const r = await api('getBalance', { workerId:w.id, month:m }, null, true);
    if (!$('#mv-bal',sh)) return;
    if (r.ok) { bal = r.data.balance - pendingAdvances(w.id, m); $('#mv-bal',sh).innerHTML = `رصيده في ${monthName(m)} حتى الآن: <b>${dz(bal)}</b>`; }
    else $('#mv-bal',sh).textContent = 'الرصيد غير متاح الآن، يُتحقق منه عند الإرسال.';
  };
  $('#mv-month',sh).onchange = () => { resetForce(); showBal(); };
  showBal();
  setTimeout(() => { const a = $('#mv-amount',sh); if (a) a.focus(); }, 250);
  $('#mv-cancel',sh).onclick = closeSheet;
  $('#mv-ok',sh).onclick = async e => {
    const amount = parseFloat(($('#mv-amount',sh).value||'').replace(',','.'));
    if (!(amount > 0)) return toast('اكتب المبلغ', true);
    const note = $('#mv-note',sh).value.trim();
    if (type !== 'دفعة' && !note) return toast('الملاحظة مطلوبة', true);
    const month = $('#mv-month',sh).value;
    if (type === 'دفعة' && !force && bal !== null && amount > bal + 0.001) {
      // الرصيد المحلي قد يكون قديمًا: نتحقق من الخادم قبل التنبيه
      const r = await api('getBalance', { workerId:w.id, month }, e.currentTarget);
      const real = r.ok ? r.data.balance - pendingAdvances(w.id, month) : bal;
      if (amount > real + 0.001) {
        bal = real; force = true;
        $('#mv-bal',sh).innerHTML = `رصيده في ${monthName(month)} حتى الآن: <b>${dz(real)}</b>`;
        $('#mv-warn',sh).innerHTML = `<div class="notice warn">ممنوع: الدفعة (${money(amount)}) أكبر من رصيد العامل (${money(real)}). اضغط الزر مرة أخرى إذا أصررت.</div>`;
        $('#mv-ok',sh).className = 'btn-danger'; $('#mv-ok',sh).textContent = 'تأكيد رغم التجاوز';
        return;
      }
    }
    const mov = { id: uid('M'), date: S.tab==='day' && S.day ? S.date : S.boot.today, month, workerId:w.id, type, amount, note, over: force, by: S.user.name };
    enqueue('addMovement', { id: mov.id, workerId:w.id, type, amount, note, month, date: mov.date, force }, `${type} ${money(amount)} دج · ${w.name}`);
    closeSheet();
    toast(`سُجّلت ${type} ${money(amount)} دج` + (bal !== null ? ` · الرصيد ${money(bal - (type==='منحة' ? -amount : amount))} دج` : ''));
    markStale();
    if (S.tab === 'day' && S.day) {
      const ww = S.day.workers.find(x => x.id === w.id);
      if (ww) { ww.movements.push(mov); const cw = C.days[S.date] && C.days[S.date].workers.find(x=>x.id===w.id); if (cw) cw.movements.push(mov); redrawCard(S.day.workers.indexOf(ww)); persistCache(); }
    }
    if (S.tab === 'month') { const M = C.months[S.month]; if (M) drawMonth(M); }
  };
}

/* ═══════════ العمال ═══════════ */
function renderWorkers(){
  const ws = S.boot.workers;
  const active = ws.filter(w => w.status !== 'متوقف'), stopped = ws.filter(w => w.status === 'متوقف');
  head({ title:'العمال', sub:`${active.length} نشط${stopped.length?` · ${stopped.length} متوقف`:''}` });
  const item = w => `<button class="card ${w.status==='متوقف'?'off':''}" data-w="${esc(w.id)}">${avatar(w.name, w.id)}
    <div class="grow"><b>${esc(w.name)}</b><small>${wageDesc(w)}${w.hours?` · ${w.hours} سا/يوم`:''}</small></div>
    ${w.wageType!=='بدون'?`<span class="amt"><span class="num">${money(w.wage)}</span> دج</span>`:`<span class="tag">قطع</span>`}</button>`;
  $('#main').innerHTML = `<div class="actions" style="margin:0 0 14px;max-width:420px"><button class="btn-main" id="add-w">إضافة عامل</button></div>
    ${active.length ? `<div class="wl">${active.map(item).join('')}</div>` : '<div class="panel empty">لا يوجد عمال بعد. أضف أول عامل.</div>'}
    ${stopped.length?`<div class="section-h"><h2>المتوقفون</h2></div><div class="wl">${stopped.map(item).join('')}</div>`:''}`;
  $('#add-w').onclick = () => workerForm(null);
  $('#main').querySelectorAll('[data-w]').forEach(el => el.onclick = () => workerForm(ws.find(w => w.id === el.dataset.w)));
}

function workerForm(w){
  const v = w || { name:'', phone:'', wageType:'يومي', wage:'', hours:8, pieces:false, joinDate:S.boot.today, leaveDate:'', status:'نشط', note:'' };
  let wageType = v.wageType;
  const sh = openSheet(`<h3>${w?esc(w.name):'عامل جديد'}</h3><div class="sub">${w && !String(w.id).startsWith('tmp')?esc(w.id):'املأ البيانات ثم احفظ'}</div>
    <div class="field"><label for="f-name">الاسم</label><input id="f-name" value="${esc(v.name)}"></div>
    <div class="field"><label for="f-phone">الهاتف</label><input id="f-phone" class="num" inputmode="tel" value="${esc(v.phone)}"></div>
    <div class="field"><label>نوع الأجر الأساسي</label><div class="seg" id="f-type">${[['يومي','يومي'],['شهري','شهري'],['بدون','بدون (قطع فقط)']].map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('')}</div></div>
    <div class="two" id="f-wagebox"><div class="field"><label for="f-wage" id="f-wage-l">الأجر</label><input id="f-wage" class="num" inputmode="decimal" value="${v.wage||''}"></div>
    <div class="field"><label for="f-hours">ساعات العمل اليومية</label><input id="f-hours" class="num" inputmode="decimal" value="${v.hours||''}"></div></div>
    <label class="switch" id="f-pcs-row"><span>يعمل بالقطع أيضًا</span><input type="checkbox" id="f-pcs" ${v.pieces?'checked':''}></label>
    <div class="two"><div class="field"><label for="f-join">تاريخ الالتحاق</label><input id="f-join" type="date" value="${esc(v.joinDate)}"></div>
    <div class="field"><label for="f-leave">تاريخ المغادرة</label><input id="f-leave" type="date" value="${esc(v.leaveDate||'')}"></div></div>
    <div class="field"><label for="f-note">ملاحظة</label><input id="f-note" value="${esc(v.note||'')}"></div>
    <div class="actions"><button class="btn-main" id="f-save">حفظ</button><button class="btn-ghost" id="f-cancel">إلغاء</button></div>
    ${w ? `<div class="actions" style="grid-template-columns:1fr 1fr;margin-top:10px">
      ${v.status==='متوقف' ? `<button class="btn-small" style="padding:10px" id="f-react">إعادة التنشيط</button>` : `<button class="btn-small red" style="padding:10px" id="f-deact">إلغاء التنشيط</button>`}
      <button class="btn-small" style="padding:10px;background:#02060E;color:#fff" id="f-del">حذف العامل</button></div>` : ''}`);
  const setType = t => {
    wageType = t;
    sh.querySelectorAll('#f-type button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    $('#f-wagebox',sh).classList.toggle('hidden', t === 'بدون');
    $('#f-pcs-row',sh).classList.toggle('hidden', t === 'بدون');
    $('#f-wage-l',sh).textContent = t === 'شهري' ? 'الأجر الشهري (دج)' : 'الأجر اليومي (دج)';
  };
  sh.querySelectorAll('#f-type button').forEach(b => b.onclick = () => setType(b.dataset.t));
  setType(wageType);
  $('#f-cancel',sh).onclick = closeSheet;

  const commit = (data, wageApply) => {
    const isNew = !w;
    const id = isNew ? uid('tmpW') : w.id;
    const today = S.boot.today;
    const pub = { id, name:data.name, phone:data.phone, wageType:data.wageType, wage: data.wageType==='بدون'?0:data.wage, hours: data.wageType==='بدون'?0:data.hours,
      pieces: data.pieces, joinDate: data.joinDate || today, leaveDate: data.leaveDate || (data.status==='متوقف' ? today : ''), status: data.status, note: data.note };
    const send = Object.assign({}, data, { id: isNew ? undefined : id, tmpId: isNew ? id : undefined, wageApply });
    if (isNew) S.boot.workers.push(pub); else S.boot.workers[S.boot.workers.findIndex(x => x.id === w.id)] = pub;
    saveBoot(S.boot);
    C.days = Object.fromEntries(Object.entries(C.days).filter(([k,d]) => d.dayStatus !== 'جديد'));  // الأيام غير المحفوظة تُعاد بناؤها بالقائمة الجديدة
    enqueue('saveWorker', { worker: send }, (isNew ? 'إضافة ' : 'تعديل ') + data.name);
    markStale(); closeSheet(); toast('حُفظ العامل'); renderWorkers();
  };

  const quick = (status, leaveDate) => {
    const data = { name:w.name, phone:w.phone||'', wageType:w.wageType, wage:w.wage, hours:w.hours, pieces:w.pieces, joinDate:w.joinDate, leaveDate, status, note:w.note||'' };
    commit(data);
  };
  if ($('#f-deact',sh)) $('#f-deact',sh).onclick = async () => {
    const ok = await confirmBox('إلغاء تنشيط ' + w.name, 'يُسجَّل تاريخ مغادرته اليوم، فلا يظهر في التقارير اليومية القادمة. تبقى كل أرقامه وأوراقه السابقة كما هي، ويمكن إعادة تنشيطه لاحقًا.', 'إلغاء التنشيط');
    if (ok) quick('متوقف', S.boot.today);
  };
  if ($('#f-react',sh)) $('#f-react',sh).onclick = () => quick('نشط', '');
  if ($('#f-del',sh)) $('#f-del',sh).onclick = () => deleteWorkerFlow(w);

  $('#f-save',sh).onclick = () => {
    const data = { name:$('#f-name',sh).value.trim(), phone:$('#f-phone',sh).value.trim(), wageType,
      wage: parseFloat($('#f-wage',sh).value) || 0, hours: parseFloat($('#f-hours',sh).value) || 0,
      pieces: wageType==='بدون' ? true : $('#f-pcs',sh).checked,
      joinDate:$('#f-join',sh).value, leaveDate:$('#f-leave',sh).value, status:'نشط', note:$('#f-note',sh).value.trim() };
    if (data.leaveDate && data.leaveDate <= S.boot.today) data.status = 'متوقف';
    if (!data.name) return toast('اسم العامل مطلوب', true);
    if (wageType !== 'بدون' && !(data.wage > 0)) return toast('قيمة الأجر مطلوبة', true);
    if (wageType !== 'بدون' && !(data.hours > 0)) return toast('عدد ساعات العمل اليومية مطلوب', true);
    if (data.leaveDate && data.joinDate && data.leaveDate < data.joinDate) return toast('تاريخ المغادرة قبل تاريخ الالتحاق', true);
    const wageChanged = w && +w.wage !== (wageType==='بدون' ? 0 : data.wage);
    if (!wageChanged) return commit(data);
    const cur = S.boot.today.slice(0,7), nxt = addMonths(cur, 1);
    const s2 = openSheet(`<h3>تغيير الأجر</h3><div class="sub">من متى يُطبَّق الأجر الجديد؟ يُحسب دائمًا من أول الشهر.</div>
      <div class="actions"><button class="btn-main" data-a="current">من أول ${monthName(cur)} (الشهر الجاري)</button>
      <button class="btn-ghost" data-a="next">من أول ${monthName(nxt)} (الشهر القادم)</button></div>`);
    s2.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      if (b.dataset.a === 'current' && monthClosed(cur)) return toast('شهر ' + monthName(cur) + ' مغلق', true);
      commit(data, b.dataset.a);
    });
  };
}

async function deleteWorkerFlow(w){
  if (String(w.id).startsWith('tmp') || Q.items.length) return toast('انتظر حتى تُرسل العمليات الجارية ثم أعد المحاولة', true);
  const ok = await confirmBox('حذف ' + w.name + ' نهائيًا؟', 'يُحذف فقط إن لم يكن له أي تقرير أو قطع أو حركة مالية. هذا لا يمكن التراجع عنه.', 'حذف العامل', true);
  if (!ok) return;
  const r = await api('deleteWorker', { id:w.id });
  if (r.ok) { saveBoot(r.data.boot); C.days = {}; markStale(); toast('حُذف العامل'); return renderWorkers(); }
  if (!r.hasData) return toast(r.error, true);
  openSheet(`<h3>لا يمكن الحذف</h3><div class="sub">${esc(r.error)}</div>
    <div class="actions"><button class="btn-main" id="d-deact">إلغاء التنشيط</button><button class="btn-ghost" id="d-no">رجوع</button></div>`, sh => {
      $('#d-no',sh).onclick = closeSheet;
      $('#d-deact',sh).onclick = () => {
        const data = { name:w.name, phone:w.phone||'', wageType:w.wageType, wage:w.wage, hours:w.hours, pieces:w.pieces, joinDate:w.joinDate, leaveDate:S.boot.today, status:'متوقف', note:w.note||'' };
        const pub = Object.assign({}, w, { status:'متوقف', leaveDate:S.boot.today });
        S.boot.workers[S.boot.workers.findIndex(x => x.id === w.id)] = pub; saveBoot(S.boot);
        enqueue('saveWorker', { worker: Object.assign({}, data, { id:w.id }) }, 'إلغاء تنشيط ' + w.name);
        C.days = Object.fromEntries(Object.entries(C.days).filter(([k,d]) => d.dayStatus !== 'جديد'));
        markStale(); closeSheet(); toast('أُلغي تنشيط العامل'); renderWorkers();
      };
    });
}

/* ═══════════ أنواع القطع ═══════════ */
function renderPieces(){
  const ts = S.boot.types;
  head({ title:'أنواع القطع', sub:`${ts.filter(t=>t.active).length} نوع نشط` });
  $('#main').innerHTML = `<div class="actions" style="margin:0 0 12px;max-width:420px"><button class="btn-main" id="add-t">إضافة نوع</button></div>
    <div class="panel">${ts.length ? ts.map(t=>`<div class="list-item" data-t="${esc(t.id)}" role="button" tabindex="0">
      <div class="grow"><b>${esc(t.name)}</b></div>
      ${t.active?'':'<span class="tag red">موقوف</span>'}<span class="amount">${dz(t.price)}</span></div>`).join('') : '<div class="empty">لا توجد أنواع بعد. أضف أول نوع وسعره.</div>'}</div>
    <div class="notice info">تغيير السعر يُطبَّق على ما يُسجَّل بعده فقط. القطع المسجلة سابقًا تحتفظ بسعرها.</div>`;
  $('#add-t').onclick = () => typeForm(null);
  $('#main').querySelectorAll('[data-t]').forEach(el => el.onclick = () => typeForm(ts.find(t => t.id === el.dataset.t)));
}
function typeForm(t){
  const v = t || { name:'', price:'', active:true };
  const sh = openSheet(`<h3>${t?esc(t.name):'نوع جديد'}</h3><div class="sub">سعر القطعة الواحدة لجميع العمال</div>
    <div class="field"><label for="t-name">الاسم</label><input id="t-name" value="${esc(v.name)}"></div>
    <div class="field"><label for="t-price">السعر (دج)</label><input id="t-price" class="num" inputmode="decimal" value="${v.price}"></div>
    <label class="switch"><span>نشط (يظهر في التسجيل)</span><input type="checkbox" id="t-act" ${v.active?'checked':''}></label>
    <div class="actions"><button class="btn-main" id="t-save">حفظ</button><button class="btn-ghost" id="t-cancel">إلغاء</button></div>`);
  $('#t-cancel',sh).onclick = closeSheet;
  $('#t-save',sh).onclick = () => {
    const name = $('#t-name',sh).value.trim(), price = parseFloat($('#t-price',sh).value) || 0, active = $('#t-act',sh).checked;
    if (!name) return toast('اسم النوع مطلوب', true);
    if (!(price > 0)) return toast('السعر يجب أن يكون أكبر من صفر', true);
    const isNew = !t, id = isNew ? uid('tmpT') : t.id;
    const pub = { id, name, price, active };
    if (isNew) S.boot.types.push(pub); else S.boot.types[S.boot.types.findIndex(x => x.id === t.id)] = pub;
    saveBoot(S.boot);
    enqueue('savePieceType', { type: { id: isNew ? undefined : id, tmpId: isNew ? id : undefined, name, price, active } }, (isNew ? 'إضافة نوع ' : 'تعديل نوع ') + name);
    closeSheet(); toast('حُفظ النوع'); renderPieces();
  };
}

/* ═══════════ الشهر ═══════════ */
function monthSel(list, sel, id='month-sel'){
  return `<div style="margin-top:10px"><select class="month-sel" id="${id}" aria-label="الشهر">${list.map(m=>`<option value="${m.month}" ${m.month===sel?'selected':''}>${monthName(m.month)}${m.status==='مغلق'?' (مغلق)':''}</option>`).join('')}</select></div>`;
}
async function renderMonth(silent){
  if (!S.month) S.month = S.boot.openMonth;
  const month = S.month;
  if (!silent) {
    head({ title:'الشهر', sub: monthName(month), extra: monthSel(S.boot.months, month) });
    $('#month-sel').onchange = e => { S.month = e.target.value; renderMonth(); };
    if (C.months[month]) drawMonth(C.months[month]); else $('#main').innerHTML = skeleton();
  }
  if (C.months[month] && !C.months[month]._stale && !silent) return;
  if (Q.items.length) return;
  const r = await api('monthSummary', { month }, null, !!C.months[month]);
  if (S.tab !== 'month' || S.month !== month) return;
  if (!r.ok) { if (!C.months[month]) $('#main').innerHTML = `<div class="notice warn">${esc(r.error)}</div>`; return; }
  C.months[month] = r.data; persistCache(); drawMonth(r.data);
}

function drawMonth(M){
  S.monthData = M;
  const main = $('#main'), closed = M.status === 'مغلق', T = M.totals;
  let html = closed ? `<div class="notice ok">الشهر مغلق${M.closedBy?' بواسطة '+esc(M.closedBy):''}${M.closedAt?' في '+esc(M.closedAt):''}. الأرقام مجمّدة.</div>`
                    : `<div class="notice info">الشهر مفتوح.${M.partial?' الأرقام محسوبة حتى اليوم.':''}${M.reopenedBy?` أُعيد فتحه بواسطة ${esc(M.reopenedBy)} في ${esc(M.reopenedAt)}.`:''}${M._stale||Q.items.length?' (تُحدَّث بعد إرسال العمليات)':''}</div>`;
  if (M.missingDays.length) html += `<div class="notice warn">أيام بلا تقرير: ${M.missingDays.map(dateShort).join('، ')}</div>`;
  html += `<div class="totals">
    <div class="big"><span>مجموع الصافي</span><b>${dz(T.net)}</b></div>
    <div><span>الأساسي</span><b>${dz(T.baseDue)}</b></div><div><span>القطع</span><b>${dz(T.piecesTotal)}</b></div>
    <div><span>الإضافية</span><b>${dz(T.otValue)}</b></div><div><span>الدفعات</span><b>${dz(T.advances)}</b></div>
    ${T.bonuses?`<div><span>المنح</span><b>${dz(T.bonuses)}</b></div>`:''}${T.deductions?`<div><span>الخصومات</span><b>${dz(T.deductions)}</b></div>`:''}
  </div>`;
  html += `<div class="section-h"><h2>العمال</h2></div><div class="panel">${M.rows.length ? M.rows.map(x=>`<div class="list-item" data-w="${esc(x.workerId)}" role="button" tabindex="0">${avatar(x.name, x.workerId)}
      <div class="grow"><b>${esc(x.name)}</b><small>${x.workDays} يوم عمل${x.absentDays?` · ${x.absentDays} غياب`:''}${x.advances?` · دفعات <span class="num">${money(x.advances)}</span>`:''}</small></div>
      <span class="amount">${dz(x.net)}</span></div>`).join('') : '<div class="empty">لا توجد بيانات لهذا الشهر.</div>'}</div>`;
  html += closed ? `<div class="actions" style="max-width:520px"><button class="btn-main" id="m-print">طباعة أوراق الشهر</button><button class="btn-ghost" id="m-reopen">إعادة فتح الشهر</button></div>`
                 : `<div class="actions" style="max-width:520px"><button class="btn-main" id="m-close">إغلاق الشهر</button></div>`;
  main.innerHTML = html;
  main.querySelectorAll('[data-w]').forEach(el => el.onclick = () => workerDetail(el.dataset.w));
  if ($('#m-close')) $('#m-close').onclick = async () => {
    if (Q.items.length) return toast('انتظر حتى تُرسل العمليات الجارية ثم أغلق الشهر', true);
    const ok = await confirmBox('إغلاق ' + monthName(M.month), 'بعد الإغلاق تُجمَّد الأرقام وتُتاح الطباعة، ولا يمكن تعديل أي تقرير أو حركة في هذا الشهر إلا بإعادة فتحه.', 'إغلاق الشهر');
    if (!ok) return;
    const r = await api('closeMonth', { month:M.month }, $('#m-close'));
    if (!r.ok) return toast(r.error, true);
    afterMonthWrite(r, 'أُغلق الشهر');
  };
  if ($('#m-reopen')) $('#m-reopen').onclick = async () => {
    const ok = await confirmBox('إعادة فتح ' + monthName(M.month), 'تُحذف الأرقام المجمّدة ويصبح الشهر قابلًا للتعديل، ويُسجَّل اسمك وتاريخ إعادة الفتح. الأوراق المطبوعة سابقًا لن تبقى مطابقة إذا عدّلت شيئًا.', 'إعادة الفتح', true);
    if (!ok) return;
    const r = await api('reopenMonth', { month:M.month }, $('#m-reopen'));
    if (!r.ok) return toast(r.error, true);
    afterMonthWrite(r, 'أُعيد فتح الشهر');
  };
  if ($('#m-print')) $('#m-print').onclick = () => { S.printMonth = M.month; goTab('print'); };
}
function afterMonthWrite(r, msg){
  saveBoot(r.data.boot); C.days = {}; markStale();
  C.months[r.data.summary.month] = r.data.summary; persistCache();
  toast(msg); renderMonth();
}

function breakdown(x){
  const kv = (l, v, cls='') => `<div class="kv ${cls}"><span>${l}</span><b>${v}</b></div>`;
  let h = kv('أيام العمل', `<span class="num">${x.workDays}</span>`);
  if (x.absentDays) h += kv('أيام الغياب', `<span class="num">${x.absentDays}</span>`);
  if (x.absHours) h += kv('ساعات الغياب', `<span class="num">${x.absHours}</span>`);
  if (x.closedDays) h += kv('أيام إغلاق الورشة', `<span class="num">${x.closedDays}</span>`);
  if (x.wageType !== 'بدون') h += kv('الأساسي المستحق', dz(x.baseDue));
  if (x.absDeduction) h += kv('خصم ساعات الغياب', dzm(x.absDeduction), 'minus');
  if (x.wageType !== 'بدون') h += kv(`الساعات الإضافية (${x.otHours} سا)`, dz(x.otValue));
  (x.piecesDetail||[]).forEach(p => h += kv(`${esc(p.name)} <span class="num">${p.qty} × ${money(p.price)}</span>`, dz(p.total)));
  if (x.piecesTotal) h += kv('مجموع القطع', dz(x.piecesTotal));
  (x.bonusesDetail||[]).forEach(b => h += kv('منحة: ' + esc(b.note), dz(b.amount)));
  (x.deductionsDetail||[]).forEach(b => h += kv('خصم: ' + esc(b.note), dzm(b.amount), 'minus'));
  h += kv('الدفعات', dzm(x.advances), 'minus');
  h += kv('الصافي', dz(x.net), 'total');
  return h;
}

/* ═══════════ لوحة المدير ═══════════ */
// الفلاتر تُطبَّق في الهاتف مباشرة على بيانات الشهر المحمّلة: لا رجوع للخادم عند الضغط
const DF = { type:null, worker:null, unit:'value' };

async function renderDash(silent){
  const cm = S.boot.today.slice(0,7);
  if (!S.dashMonth) S.dashMonth = cm;
  const month = S.dashMonth;
  if (!silent) {
    head({ title:'التقارير', sub: monthName(month), extra: monthSel(S.boot.months, month, 'dash-sel') });
    $('#dash-sel').onchange = e => { S.dashMonth = e.target.value; DF.type = null; DF.worker = null; renderDash(); };
    if (C.dash[month]) drawDash(C.dash[month]); else $('#main').innerHTML = `<div class="kpis">${'<div class="kpi k-ink" style="height:96px;opacity:.4"></div>'.repeat(4)}</div>`;
  }
  if (Q.items.length) return;
  const r = await api('dashboard', { month }, null, !!C.dash[month]);
  if (S.tab !== 'dash' || S.dashMonth !== month) return;
  if (!r.ok) { if (!C.dash[month]) $('#main').innerHTML = `<div class="notice warn">${esc(r.error)}</div>`; return; }
  C.dash[month] = r.data; persistCache(); drawDash(r.data);
}

function deltaHtml(cur, prev){
  if (prev === null || prev === undefined) return '';
  if (!prev && !cur) return `<span class="delta">بلا تغيير</span>`;
  if (!prev) return `<span class="delta">جديد</span>`;
  const p = (cur - prev) / Math.abs(prev) * 100;
  return `<span class="delta">${p >= 0 ? '▲' : '▼'} <span class="num">${Math.abs(p).toFixed(0)}%</span></span>`;
}

const DONUT_COLORS = ['#C50337','#2F6FDE','#17996A','#E07A12','#8C5BA0','#0E8C9A','#D94E7A','#6B7280'];
const workerName = (D, id) => { const r = D.summary.rows.find(x => x.workerId === id); if (r) return r.name; const w = S.boot.workers.find(x => x.id === id); return w ? w.name : id; };
const typeName = (D, id) => (D.typeNames && D.typeNames[id]) || (typeById(id) || {}).name || id;

/** يحسب كل ما تعرضه اللوحة حسب الفلاتر الحالية */
function dashModel(D){
  const cells = (D.cells || []).filter(c => (!DF.type || c[2] === DF.type) && (!DF.worker || c[1] === DF.worker));
  const u = DF.unit === 'qty' ? 3 : 4;
  // الإنتاج اليومي
  const byDate = {}; cells.forEach(c => byDate[c[0]] = (byDate[c[0]] || 0) + c[u]);
  const prod = D.series.map(s => ({ date:s.date, v: byDate[s.date] || 0 }));
  // الأنواع (تتأثر بفلتر العامل فقط حتى تبقى كلها ظاهرة للاختيار)
  const tAgg = {};
  (D.cells || []).filter(c => !DF.worker || c[1] === DF.worker).forEach(c => { const t = tAgg[c[2]] || (tAgg[c[2]] = { typeId:c[2], qty:0, value:0 }); t.qty += c[3]; t.value += c[4]; });
  const types = Object.values(tAgg).sort((a,b) => b.value - a.value);
  // ترتيب العمال
  let rank;
  if (DF.type) {
    const wAgg = {};
    (D.cells || []).filter(c => c[2] === DF.type).forEach(c => wAgg[c[1]] = (wAgg[c[1]] || 0) + c[u]);
    rank = Object.keys(wAgg).map(id => ({ id, name: workerName(D, id), v: wAgg[id] }));
  } else rank = D.summary.rows.map(r => ({ id:r.workerId, name:r.name, v:r.net }));
  rank.sort((a,b) => b.v - a.v);
  // الحضور
  const attByDate = {};
  if (DF.worker) (D.att || []).filter(a => a[1] === DF.worker).forEach(a => attByDate[a[0]] = a[2]);
  // البطاقات
  const T = D.summary.totals, P = D.prev ? D.prev.totals : null;
  let k = { net:T.net, baseDue:T.baseDue, piecesTotal:T.piecesTotal, otValue:T.otValue, advances:T.advances, bm:T.bonuses - T.deductions,
            att: D.attendance.workDays + D.attendance.absentDays ? D.attendance.workDays / (D.attendance.workDays + D.attendance.absentDays) * 100 : 0 };
  let pk = P ? { net:P.net, baseDue:P.baseDue, piecesTotal:P.piecesTotal, otValue:P.otValue, advances:P.advances, bm:P.bonuses - P.deductions,
            att: P.workDays + P.absentDays ? P.workDays / (P.workDays + P.absentDays) * 100 : 0 } : null;
  if (DF.worker) {
    const r = D.summary.rows.find(x => x.workerId === DF.worker) || {};
    const pr = D.prev && (D.prev.rows || []).find(x => x.workerId === DF.worker);
    const one = x => x ? { net:x.net, baseDue:x.baseDue, piecesTotal:x.piecesTotal, otValue:x.otValue, advances:x.advances, bm:(x.bonuses||0) - (x.deductions||0),
      att: (x.workDays + x.absentDays) ? x.workDays / (x.workDays + x.absentDays) * 100 : 0 } : null;
    k = one(r) || k; pk = D.prev ? (one(pr) || { net:0, baseDue:0, piecesTotal:0, otValue:0, advances:0, bm:0, att:0 }) : null;
  }
  if (DF.type) {
    k.piecesTotal = (D.cells || []).filter(c => c[2] === DF.type && (!DF.worker || c[1] === DF.worker)).reduce((a,c) => a + c[4], 0);
    if (pk) pk.piecesTotal = (D.prev.byWT || []).filter(x => x[1] === DF.type && (!DF.worker || x[0] === DF.worker)).reduce((a,x) => a + x[3], 0);
  }
  return { prod, types, rank, attByDate, k, pk };
}

function drawDash(D){
  const M = dashModel(D);
  const tdy = D.today;
  let todayHtml;
  if (tdy.off) todayHtml = `<div class="dot" style="background:var(--gold)">${IC.day}</div><div><b>اليوم عطلة أسبوعية</b></div>`;
  else if (tdy.closed) todayHtml = `<div class="dot" style="background:var(--muted)">${IC.x}</div><div><b>الورشة مغلقة اليوم</b></div>`;
  else if (tdy.saved) todayHtml = `<div class="dot" style="background:var(--ok)">${IC.ok}</div><div><b>تقرير اليوم محفوظ</b><br><small style="color:var(--muted)"><span class="num">${tdy.present}</span> حاضر · <span class="num">${tdy.absent}</span> غائب من <span class="num">${tdy.required}</span></small></div>`;
  else todayHtml = `<div class="dot" style="background:var(--brick)">${IC.warn}</div><div><b>تقرير اليوم لم يُحفظ بعد</b><br><small style="color:var(--muted)">${tdy.required} عامل مطلوب</small></div>`;

  const cmpNote = D.prev ? (D.prev.partial
      ? `المقارنة مع أول <span class="num">${D.prev.days}</span> ${D.prev.days>2&&D.prev.days<11?'أيام':'يومًا'} من ${monthName(D.prev.month)}`
      : `المقارنة مع شهر ${monthName(D.prev.month)} كاملًا`) : 'لا يوجد شهر سابق للمقارنة';
  const pv = key => M.pk ? M.pk[key] : null;
  const kpi = (cls, label, key, big=false) => `<div class="kpi ${cls} ${big?'big':''}"><span>${label}</span><b>${dz(M.k[key])}</b>${deltaHtml(M.k[key], pv(key))}</div>`;
  const showBM = M.k.bm || (M.pk && M.pk.bm);

  const filters = (DF.type || DF.worker) ? `<div class="filter-bar">
      ${DF.worker ? `<button class="chip" data-clear="worker">${esc(workerName(D, DF.worker))} ✕</button>` : ''}
      ${DF.type ? `<button class="chip gold" data-clear="type">${esc(typeName(D, DF.type))} ✕</button>` : ''}
      <button class="chip ghost" data-clear="all">إلغاء الكل</button></div>` : `<div class="filter-hint">اضغط على نوع قطعة أو على عامل لتصفية التقارير</div>`;

  const unitSeg = `<div class="seg mini" id="unit-seg"><button data-u="value" class="${DF.unit==='value'?'on':''}">القيمة</button><button data-u="qty" class="${DF.unit==='qty'?'on':''}">العدد</button></div>`;
  const prodTitle = 'الإنتاج اليومي' + (DF.type ? ': ' + esc(typeName(D, DF.type)) : '') + (DF.worker ? ' · ' + esc(workerName(D, DF.worker)) : '');
  const rankTitle = DF.type ? `من صنع أكثر: ${esc(typeName(D, DF.type))}` : 'صافي العمال';
  const attTitle = DF.worker ? `حضور ${esc(workerName(D, DF.worker))}` : 'الحضور اليومي';

  const alerts = [];
  D.alerts.openMonths.forEach(m => alerts.push(`شهر ${monthName(m)} لم يُغلق بعد`));
  if (D.alerts.missing.length) alerts.push(`أيام بلا تقرير: ${D.alerts.missing.map(dateShort).join('، ')}`);
  D.alerts.over.forEach(o => alerts.push(`دفعة تجاوزت الرصيد: ${esc(o.name)} <span class="num">${money(o.amount)}</span> دج (${dateShort(o.date)})`));

  $('#main').innerHTML = `<div class="panel dash-today">${todayHtml}</div>
    ${filters}
    <div class="kpis">
      ${kpi('k-green', DF.worker ? 'صافي العامل' : 'مجموع الصافي', 'net', true)}
      ${kpi('k-teal','الأجور الأساسية','baseDue')}
      ${kpi('k-gold', DF.type ? 'قيمة ' + esc(typeName(D, DF.type)) : 'قيمة القطع','piecesTotal')}
      ${kpi('k-amber','الساعات الإضافية','otValue')}
      ${kpi('k-brick','الدفعات','advances')}
      ${showBM ? kpi('k-plum','المنح − الخصومات','bm') : ''}
      <div class="kpi k-ink"><span>نسبة الحضور</span><b><span class="num">${Math.round(M.k.att)}%</span></b>${M.pk ? deltaHtml(M.k.att, M.pk.att) : ''}</div>
    </div>
    <div class="cmp-note">${cmpNote}</div>
    <div class="dash-grid">
      <div class="panel wide"><div class="ph-row"><h3 class="ph">${prodTitle}</h3>${unitSeg}</div><div id="prod-chart">${productionChart(M.prod)}</div></div>
      <div class="panel"><h3 class="ph">أنواع القطع${DF.worker ? ' · ' + esc(workerName(D, DF.worker)) : ''}</h3>${typesDonut(D, M.types)}</div>
      <div class="panel"><h3 class="ph">${rankTitle}</h3>${workersRank(M.rank)}</div>
      <div class="panel wide"><h3 class="ph">${attTitle}</h3>${attendanceChart(D.series, DF.worker ? M.attByDate : null)}
        <div class="legend"><span><i style="background:var(--ok)"></i>حاضر</span><span><i style="background:var(--brick)"></i>غائب</span><span><i style="background:var(--line)"></i>مغلقة أو عطلة</span></div></div>
      ${alerts.length ? `<div class="panel wide"><h3 class="ph">تنبيهات</h3>${alerts.map(a => `<div class="alert-row"><span style="color:var(--brick)">●</span><span>${a}</span></div>`).join('')}</div>` : ''}
    </div>`;

  const main = $('#main');
  main.querySelectorAll('[data-type]').forEach(el => el.onclick = () => { DF.type = DF.type === el.dataset.type ? null : el.dataset.type; drawDash(D); });
  main.querySelectorAll('[data-wk]').forEach(el => el.onclick = () => { DF.worker = DF.worker === el.dataset.wk ? null : el.dataset.wk; drawDash(D); });
  main.querySelectorAll('[data-clear]').forEach(el => el.onclick = () => { const c = el.dataset.clear; if (c !== 'worker') DF.type = null; if (c !== 'type') DF.worker = null; drawDash(D); });
  main.querySelectorAll('#unit-seg [data-u]').forEach(el => el.onclick = () => { DF.unit = el.dataset.u; drawDash(D); });
}

function attendanceChart(series, one){
  if (!series.length) return '<div class="empty">لا توجد أيام بعد.</div>';
  const W = 640, H = 170, pad = 22, n = series.length;
  const max = one ? 1 : Math.max(1, ...series.map(s => s.present + s.absent));
  const bw = (W - pad*2) / n;
  let bars = '';
  series.forEach((s, i) => {
    const x = W - pad - (i+1)*bw + bw*0.15, w = bw*0.7, full = H - pad*2;
    if (one) {
      const st = one[s.date];
      if (s.off || s.closed || st === undefined) bars += `<rect x="${x}" y="${H-pad-6}" width="${w}" height="6" rx="2" fill="var(--line)"/>`;
      else bars += `<rect x="${x}" y="${pad}" width="${w}" height="${full}" rx="3" fill="${st ? 'var(--ok)' : 'var(--brick)'}"/>`;
    } else {
      const total = s.present + s.absent;
      if (s.off || s.closed || !total) bars += `<rect x="${x}" y="${H-pad-6}" width="${w}" height="6" rx="2" fill="var(--line)"/>`;
      else {
        const hp = (s.present / max) * full, ha = (s.absent / max) * full;
        bars += `<rect x="${x}" y="${H-pad-hp}" width="${w}" height="${hp}" rx="3" fill="var(--ok)"/>`;
        if (ha) bars += `<rect x="${x}" y="${H-pad-hp-ha-1}" width="${w}" height="${ha}" rx="3" fill="var(--brick)"/>`;
      }
    }
    const day = +s.date.slice(8);
    if (n <= 12 || day % 5 === 0 || day === 1) bars += `<text x="${x + w/2}" y="${H-6}" text-anchor="middle">${day}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="الحضور">${bars}</svg>`;
}

function productionChart(prod){
  if (!prod.length) return '<div class="empty">لا توجد أيام بعد.</div>';
  const isQty = DF.unit === 'qty';
  const W = 640, H = 170, pad = 24, n = prod.length;
  const max = Math.max(1, ...prod.map(s => s.v));
  const X = i => n === 1 ? W/2 : W - (pad + i * (W - pad*2) / (n - 1));
  const Y = v => H - pad - (v / max) * (H - pad*2);
  const pts = prod.map((s, i) => [X(i), Y(s.v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${H-pad} L${pts[0][0].toFixed(1)} ${H-pad} Z`;
  const total = prod.reduce((a, s) => a + s.v, 0);
  let labels = '';
  prod.forEach((s, i) => { const day = +s.date.slice(8); if (n <= 12 || day % 5 === 0 || day === 1) labels += `<text x="${X(i)}" y="${H-6}" text-anchor="middle">${day}</text>`; });
  const best = prod.reduce((b, s) => s.v > b.v ? s : b, prod[0]);
  const fmtV = v => isQty ? `<span class="num">${money(v)}</span> قطعة` : dz(v);
  const col = isQty ? '#2F6FDE' : '#C50337';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="الإنتاج اليومي">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".5"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#pg)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${prod[i].v ? 3 : 1.6}" fill="${col}"><title>${dateShort(prod[i].date)}: ${money(prod[i].v)}</title></circle>`).join('')}${labels}</svg>
    <div class="legend"><span>المجموع: <b>${fmtV(total)}</b></span>${best.v ? `<span>أعلى يوم: ${dateShort(best.date)} (${fmtV(best.v)})</span>` : ''}</div>`;
}

function typesDonut(D, types){
  if (!types.length) return '<div class="empty">لا توجد قطع مسجلة.</div>';
  const key = DF.unit === 'qty' ? 'qty' : 'value';
  const total = types.reduce((a, t) => a + t[key], 0) || 1;
  const R = 52, Cc = 2 * Math.PI * R;
  let off = 0, arcs = '';
  types.forEach((t, i) => {
    const len = t[key] / total * Cc;
    const dim = DF.type && DF.type !== t.typeId;
    arcs += `<circle data-type="${esc(t.typeId)}" style="cursor:pointer;opacity:${dim ? .25 : 1};transition:opacity .15s" cx="70" cy="70" r="${R}" fill="none" stroke="${DONUT_COLORS[i % 8]}" stroke-width="${DF.type === t.typeId ? 28 : 22}" stroke-dasharray="${Math.max(0.01, len)} ${Cc - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(typeName(D, t.typeId))}</title></circle>`;
    off += len;
  });
  const sel = DF.type && types.find(t => t.typeId === DF.type);
  const centerVal = sel ? sel[key] : total;
  return `<div class="donut-wrap"><svg viewBox="0 0 140 140" class="chart" role="img" aria-label="أنواع القطع">${arcs}
      <text x="70" y="66" text-anchor="middle" style="font-size:10px">${sel ? esc(typeName(D, sel.typeId)).slice(0, 14) : 'المجموع'}</text>
      <text x="70" y="84" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--ink)">${money(centerVal)}</text></svg>
    <div class="legend type-list">${types.map((t, i) => `<button class="type-item ${DF.type === t.typeId ? 'on' : ''} ${DF.type && DF.type !== t.typeId ? 'dim' : ''}" data-type="${esc(t.typeId)}">
      <i style="background:${DONUT_COLORS[i % 8]}"></i><span class="tn">${esc(typeName(D, t.typeId))}</span>
      <b class="num">${t.qty}</b> قطعة · <span class="num">${Math.round(t[key] / total * 100)}%</span></button>`).join('')}</div></div>`;
}

function workersRank(rank){
  if (!rank.length) return '<div class="empty">لا توجد بيانات.</div>';
  const max = Math.max(1, ...rank.map(r => Math.abs(r.v)));
  const isQty = DF.type && DF.unit === 'qty';
  return `<div class="rank">${rank.map(r => `<button class="r ${DF.worker === r.id ? 'on' : ''} ${DF.worker && DF.worker !== r.id ? 'dim' : ''}" data-wk="${esc(r.id)}">
    <span class="nm">${esc(r.name)}</span>
    <div class="track"><div class="fill" style="width:${Math.max(2, Math.abs(r.v) / max * 100)}%;${r.v < 0 ? 'background:var(--brick)' : ''}"></div></div>
    <b class="num" style="font-size:13px">${money(r.v)}${isQty ? '' : ''}</b></button>`).join('')}</div>`;
}

/* ═══════════ الطباعة ═══════════ */
async function renderPrint(){
  const closedMonths = S.boot.months.filter(m => m.status === 'مغلق');
  head({ title:'الطباعة', sub:'أوراق العمال الشهرية' });
  const main = $('#main');
  if (!closedMonths.length) { main.innerHTML = `<div class="panel empty">لا يوجد شهر مغلق بعد.<br>الأوراق تُطبع بعد إغلاق الشهر من تبويب الشهر.</div>`; return; }
  if (!S.printMonth || !closedMonths.find(m=>m.month===S.printMonth)) S.printMonth = closedMonths[0].month;
  main.innerHTML = `<div class="panel" style="max-width:620px"><div class="field"><label for="pm">الشهر</label><select id="pm" class="month-sel" style="width:100%">${closedMonths.map(m=>`<option value="${m.month}" ${m.month===S.printMonth?'selected':''}>${monthName(m.month)}</option>`).join('')}</select></div>
    <button class="btn-main" id="print-all">طباعة كل الأوراق</button></div><div id="slips-list" style="max-width:620px"></div>`;
  const draw = data => {
    S.slips = data;
    $('#slips-list').innerHTML = `<div class="panel">${data.slips.map((x,i)=>`<div class="list-item"><div class="grow"><b>${esc(x.name)}</b><small>الصافي <span class="num">${money(x.net)}</span> دج</small></div><button class="btn-small" data-p="${i}">طباعة</button></div>`).join('') || '<div class="empty">لا توجد أوراق.</div>'}</div>`;
    $('#slips-list').querySelectorAll('[data-p]').forEach(b => b.onclick = () => doPrint([S.slips.slips[+b.dataset.p]]));
  };
  const load = async () => {
    const m = S.printMonth;
    if (C.slips[m]) draw(C.slips[m]); else $('#slips-list').innerHTML = skeleton();
    const r = await api('getPayslips', { month:m }, null, !!C.slips[m]);
    if (S.printMonth !== m || S.tab !== 'print') return;
    if (!r.ok) { if (!C.slips[m]) $('#slips-list').innerHTML = `<div class="notice warn">${esc(r.error)}</div>`; return; }
    C.slips[m] = r.data; persistCache(); draw(r.data);
  };
  $('#pm').onchange = e => { S.printMonth = e.target.value; load(); };
  $('#print-all').onclick = () => S.slips && doPrint(S.slips.slips);
  load();
}

function slipHtml(x, P){
  const row = (l, v) => `<tr><td>${l}</td><td class="n">${v}</td></tr>`;
  const typeLbl = x.wageType==='يومي'?'يومي':x.wageType==='شهري'?'شهري':'بالقطع فقط';
  let h = `<div class="slip">
    <div class="slip-h"><div><div class="ws">ورشة ${esc(P.workshopName)}</div><div class="t">الورقة الشهرية · ${monthName(P.month)}</div></div>${RINGS_SVG}</div>
    <div class="slip-id">
      <div><span>العامل</span><b>${esc(x.name)}</b></div>
      <div><span>الشهر</span><b>${monthName(P.month)}</b></div>
      <div><span>نوع الأجر</span><b>${typeLbl}${x.pieces&&x.wageType!=='بدون'?' + قطع':''}</b></div>
      <div><span>الأجر الأساسي</span><b>${x.wageType==='بدون'?'—':dz(x.wage)}</b></div>
    </div>
    <h4>الحضور</h4><table>
      ${row('أيام العمل', x.workDays)}${row('أيام الغياب', x.absentDays)}
      ${x.absHours?row('ساعات الغياب', x.absHours):''}${x.closedDays?row('أيام إغلاق الورشة', x.closedDays):''}
    </table>`;
  if (x.wageType !== 'بدون') h += `<h4>الأجر الأساسي والساعات</h4><table>
      ${row('الأجر الأساسي المستحق', dz(x.baseDue))}
      ${x.absDeduction?row('خصم ساعات الغياب', dzm(x.absDeduction)):''}
      ${row('الساعات الإضافية: '+x.otHours+' سا', dz(x.otValue))}</table>`;
  if (x.pieces || (x.piecesDetail||[]).length) h += `<h4>القطع</h4><table><tr><th>النوع</th><th class="n">العدد</th><th class="n">السعر</th><th class="n">المجموع</th></tr>
      ${(x.piecesDetail||[]).map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${p.qty}</td><td class="n">${money(p.price)}</td><td class="n">${money(p.total)}</td></tr>`).join('') || '<tr><td colspan="4">لا قطع</td></tr>'}
      <tr><th colspan="3">مجموع القطع</th><th class="n">${dz(x.piecesTotal)}</th></tr></table>`;
  if ((x.bonusesDetail||[]).length) h += `<h4>المنح</h4><table>${x.bonusesDetail.map(b=>row(esc(b.note), dz(b.amount))).join('')}<tr><th>مجموع المنح</th><th class="n">${dz(x.bonuses)}</th></tr></table>`;
  if ((x.deductionsDetail||[]).length) h += `<h4>الخصومات</h4><table>${x.deductionsDetail.map(b=>row(esc(b.note), dz(b.amount))).join('')}<tr><th>مجموع الخصومات</th><th class="n">${dz(x.deductions)}</th></tr></table>`;
  h += `<h4>الدفعات</h4><table>${row('مجموع الدفعات', dz(x.advances))}</table>
    <div class="netrow"><span>الأجرة الصافية</span><span>${dz(x.net)}</span></div>
    <div class="sign"><div>إمضاء العامل</div></div>
    <div class="foot"><span>أخرجها: ${esc(P.printedBy)}</span><span>بتاريخ: <span class="num">${esc(P.printedAt)}</span></span></div></div>`;
  return h;
}

function doPrint(list){
  if (!list.length) return;
  $('#print-area').innerHTML = list.map(x => slipHtml(x, S.slips)).join('');
  setTimeout(() => window.print(), 120);
}

/* ═══════════ البداية ═══════════ */
window.addEventListener('beforeunload', e => { if (S.dirty || Q.items.length) { e.preventDefault(); e.returnValue = ''; } });
if (S.user && S.pin && S.boot) { S.date = S.boot.nextDay; startApp(); (async () => { const r = await rawApi('bootstrap'); if (r.ok && !Q.items.length) { saveBoot(r.data); } })(); }
else if (S.user && S.pin) { (async () => { const r = await api('bootstrap'); if (r.ok) { saveBoot(r.data); S.date = S.boot.nextDay; startApp(); } else renderLogin(); })(); }
else renderLogin();

</script>
